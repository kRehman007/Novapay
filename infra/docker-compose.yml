version: '3.8'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api-gateway
    networks:
      - novapay

  api-gateway:
    build:
      context: ../services/api-gateway
      dockerfile: Dockerfile
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=novapay_jwt_secret_2024
      - SERVICE_KEY=7fK9xP2mQ8vL4nR6tY3wZ1aB5kT0eH
      - ACCOUNT_SERVICE_URL=http://account-service:4001
      - TRANSACTION_SERVICE_URL=http://transaction-service:4002
      - LEDGER_SERVICE_URL=http://ledger-service:4003
      - FX_SERVICE_URL=http://fx-service:4004
      - PAYROLL_SERVICE_URL=http://payroll-service:4005
      - ADMIN_SERVICE_URL=http://admin-service:4006
    depends_on:
      - account-service
      - transaction-service
      - ledger-service
      - fx-service
      - payroll-service
      - admin-service
    networks:
      - novapay

  account-service:
    build:
      context: ../services/account-service
      dockerfile: Dockerfile
    ports:
      - "4001:4001"
    environment:
      - PORT=4001
      - MONGODB_URI=mongodb://mongodb-account:27017/novapay_account_db?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=novapay_jwt_secret_2024
      - SERVICE_KEY=7fK9xP2mQ8vL4nR6tY3wZ1aB5kT0eH
    depends_on:
      - mongodb-account
      - redis
    networks:
      - novapay

  transaction-service:
    build:
      context: ../services/transaction-service
      dockerfile: Dockerfile
    ports:
      - "4002:4002"
    environment:
      - PORT=4002
      - MONGODB_URI=mongodb://mongodb-transaction:27017/novapay_txn_db?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_KEY=7fK9xP2mQ8vL4nR6tY3wZ1aB5kT0eH
      - ACCOUNT_SERVICE_URL=http://account-service:4001
      - LEDGER_SERVICE_URL=http://ledger-service:4003
      - FX_SERVICE_URL=http://fx-service:4004
    depends_on:
      - mongodb-transaction
      - redis
      - account-service
      - ledger-service
      - fx-service
    networks:
      - novapay

  ledger-service:
    build:
      context: ../services/ledger-service
      dockerfile: Dockerfile
    ports:
      - "4003:4003"
    environment:
      - PORT=4003
      - MONGODB_URI=mongodb://mongodb-ledger:27017/novapay_ledger_db?replicaSet=rs0
      - SERVICE_KEY=7fK9xP2mQ8vL4nR6tY3wZ1aB5kT0eH
    depends_on:
      - mongodb-ledger
    networks:
      - novapay

  fx-service:
    build:
      context: ../services/fx-service
      dockerfile: Dockerfile
    ports:
      - "4004:4004"
    environment:
      - PORT=4004
      - MONGODB_URI=mongodb://mongodb-fx:27017/novapay_fx_db?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_KEY=7fK9xP2mQ8vL4nR6tY3wZ1aB5kT0eH
    depends_on:
      - mongodb-fx
      - redis
    networks:
      - novapay

  payroll-service:
    build:
      context: ../services/payroll-service
      dockerfile: Dockerfile
    ports:
      - "4005:4005"
    environment:
      - PORT=4005
      - MONGODB_URI=mongodb://mongodb-payroll:27017/novapay_payroll_db?replicaSet=rs0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SERVICE_KEY=7fK9xP2mQ8vL4nR6tY3wZ1aB5kT0eH
      - TRANSACTION_SERVICE_URL=http://transaction-service:4002
    depends_on:
      - mongodb-payroll
      - redis
      - transaction-service
    networks:
      - novapay

  admin-service:
    build:
      context: ../services/admin-service
      dockerfile: Dockerfile
    ports:
      - "4006:4006"
    environment:
      - PORT=4006
      - MONGODB_URI=mongodb://mongodb-admin:27017/novapay_admin_db?replicaSet=rs0
      - SERVICE_KEY=7fK9xP2mQ8vL4nR6tY3wZ1aB5kT0eH
      - ACCOUNT_SERVICE_URL=http://account-service:4001
      - TRANSACTION_SERVICE_URL=http://transaction-service:4002
      - LEDGER_SERVICE_URL=http://ledger-service:4003
    depends_on:
      - mongodb-admin
      - account-service
      - transaction-service
      - ledger-service
    networks:
      - novapay

  mongodb-account:
    image: mongo:7.0
    ports:
      - "27017:27017"
    command: mongod --replSet rs0
    volumes:
      - mongodb-account-data:/data/db
    networks:
      - novapay

  mongodb-transaction:
    image: mongo:7.0
    ports:
      - "27018:27017"
    command: mongod --replSet rs0
    volumes:
      - mongodb-transaction-data:/data/db
    networks:
      - novapay

  mongodb-ledger:
    image: mongo:7.0
    ports:
      - "27019:27017"
    command: mongod --replSet rs0
    volumes:
      - mongodb-ledger-data:/data/db
    networks:
      - novapay

  mongodb-fx:
    image: mongo:7.0
    ports:
      - "27020:27017"
    command: mongod --replSet rs0
    volumes:
      - mongodb-fx-data:/data/db
    networks:
      - novapay

  mongodb-payroll:
    image: mongo:7.0
    ports:
      - "27021:27017"
    command: mongod --replSet rs0
    volumes:
      - mongodb-payroll-data:/data/db
    networks:
      - novapay

  mongodb-admin:
    image: mongo:7.0
    ports:
      - "27022:27017"
    command: mongod --replSet rs0
    volumes:
      - mongodb-admin-data:/data/db
    networks:
      - novapay

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - novapay

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - novapay

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - novapay

volumes:
  mongodb-account-data:
  mongodb-transaction-data:
  mongodb-ledger-data:
  mongodb-fx-data:
  mongodb-payroll-data:
  mongodb-admin-data:
  redis-data:

networks:
  novapay:
    driver: bridge
